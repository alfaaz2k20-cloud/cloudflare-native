name: The Phantom Weekly Writer

# Authoritative Sunday publication is executed directly by the Cloudflare Worker cron trigger (wrangler.jsonc).
# This workflow is retained for manual on-demand triggers via GitHub Actions UI.
on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  wake_the_phantom:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Curator API
        run: |
          curl -v -X POST "https://alfaazcollective.org/blogs/generate" \
               -H "Authorization: Bearer ${{ secrets.PHANTOM_SECRET_TOKEN }}" \
               -H "Content-Type: application/json" \
               -d "{}" \
               --max-time 180
