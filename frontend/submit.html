<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2d2722">
  <meta name="application-name" content="Alfaaz">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alfaaz">
  <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <meta name="description" content="Submit portfolios, manuscripts, and project proposals securely to the Curator's Storage at Alfaaz Collective." />
  <title>Curator's Storage — ALFAAZ</title>
  <script src="https://unpkg.com/lucide@1.66.0/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="global.css">
  <script type="module" src="global.js"></script>
  <script type="module" src="src/submit.js"></script>
  <style>
    .vault-container { max-width: 680px; margin: 7.5rem auto 5rem; padding: 0 1.5rem; }
    .panel-title { font-family: var(--font-heading); font-size: 2.5rem; font-weight: 400; letter-spacing: 0.5px; margin-bottom: 0.4rem; color: var(--text-primary); text-align: center; line-height: 1.2; }
    .panel-subtitle { font-size: 11px; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 2.5rem; text-align: center; }
    .vault-card { background: var(--bg-secondary); border: 1px solid var(--grid-border); box-shadow: var(--shadow-float); padding: 3rem 2.5rem; }
    
    .input-group { margin-bottom: 1.8rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .input-label { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-gold-text); }
    .field-hint { font-size: 10px; color: var(--text-secondary); letter-spacing: 0.5px; margin-bottom: 0.2rem; }
    
    .auth-input, select, textarea {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--grid-border);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 0.75rem 0;
      transition: border-color 0.3s ease;
      border-radius: 0;
      outline: none;
    }
    .auth-input:focus, select:focus, textarea:focus { border-bottom-color: var(--accent-gold); }
    
    select option { background: var(--bg-secondary); color: var(--text-primary); }

    .file-upload-wrapper { margin-top: 0.3rem; }
    .file-upload-wrapper input[type="file"] {
      font-size: 11px; color: var(--text-secondary);
      width: 100%; background: transparent; border: none; padding: 0.4rem 0;
    }
    .file-upload-wrapper input[type="file"]::file-selector-button {
      background: var(--bg-primary); color: var(--text-primary);
      border: 1px solid var(--grid-border);
      padding: 0.65rem 1.4rem; margin-right: 1rem;
      font-family: var(--font-body); font-size: 10px;
      text-transform: uppercase; letter-spacing: 1.5px;
      cursor: pointer; transition: all 0.3s ease; border-radius: 0;
    }
    .file-upload-wrapper input[type="file"]::file-selector-button:hover {
      background: var(--accent-gold); color: #fff; border-color: var(--accent-gold);
    }

    .file-feedback { font-size: 11px; letter-spacing: 0.5px; min-height: 1.2em; margin-top: 0.4rem; }
    #status-msg { margin-top: 1.5rem; font-size: 11px; text-align: center; letter-spacing: 1px; text-transform: uppercase; min-height: 1.2em; }
    
    @media (max-width: 640px) {
      .vault-card { padding: 2rem 1.5rem; }
      .vault-container { margin-top: 6rem; }
    }
  </style>
</head>
<body>

  <nav id="navbar" style="justify-content: space-between;">
    <a href="index.html" class="logo">ALFAAZ</a>
    <div class="nav-actions" style="display: flex; gap: 1.5rem; align-items: center;">
      <a href="dashboard.html" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Dashboard</a>
      <a href="index.html" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Return</a>
    </div>
  </nav>

  <div class="vault-container">
    <div class="vault-card panel">
      <h1 class="panel-title">The Curator's Storage</h1>
      <p class="panel-subtitle">مخزنِ کلام // Securely Deposit Creative Works &amp; Proposals</p>
      
      <form id="submission-form">
        <div class="input-group">
          <label class="input-label" for="sub-type">Submission Category *</label>
          <select id="sub-type" required>
            <option value="Art Portfolio (PDF/IMG)">Art Portfolio (PDF / Visual Arts)</option>
            <option value="Literary Manuscript (PDF/Doc)">Literary Manuscript / Poetry</option>
            <option value="Project Proposal">Exhibition / Project Proposal</option>
            <option value="Membership Form">Collective Membership Ingestion</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label" for="title">Work Title / Designation *</label>
          <input type="text" id="title" class="auth-input" required maxlength="200" placeholder="e.g. The Autumn Manuscript / Pinjrakari Series">
        </div>

        <div class="input-group">
          <label class="input-label" for="file-upload">Document or Portfolio *</label>
          <span class="field-hint">PDF, PNG, JPG, or WebP format (Max 20MB)</span>
          <div class="file-upload-wrapper">
            <input type="file" id="file-upload" accept="application/pdf,image/png,image/jpeg,image/webp,.pdf,.png,.jpg,.jpeg,.webp" required>
          </div>
          <div id="file-feedback" class="file-feedback"></div>
        </div>

        <div class="input-group">
          <label class="input-label" for="note">Curator's Context Note <span style="font-weight:400; text-transform:none; letter-spacing:0;">(Optional)</span></label>
          <span class="field-hint">Brief background, provenance, or curatorial intent (Max 1500 chars)</span>
          <textarea id="note" rows="3" maxlength="1500" placeholder="Provide any relevant context for the curatorial review team..."></textarea>
        </div>

        <button type="submit" id="submit-btn" class="submit-btn" style="width: 100%; margin-top: 1rem;">Deposit into Storage</button>
      </form>
      <div id="status-msg" aria-live="polite"></div>
    </div>
  </div>

</body>
</html>
