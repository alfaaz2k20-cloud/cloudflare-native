<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2d2722">
  <meta name="application-name" content="Alfaaz">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alfaaz">
  <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <meta name="description" content="Read curated reflections, essays, and notes from Alfaaz Collective archives." />
  <meta property="og:site_name" content="Alfaaz Collective" />
  <meta property="og:title" id="ogTitle" content="Curated Essay | Alfaaz Collective" />
  <meta property="og:description" id="ogDesc" content="Read curated reflections and notes from the Alfaaz Collective archives." />
  <meta property="og:image" content="https://res.cloudinary.com/dmqwjpmjk/image/upload/c_fill,w_1200,h_630,q_auto,f_auto/v1777653360/photo_2026-05-01_22-00-43_jsuqqm.jpg" />
  <meta property="og:type" content="article" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" id="twTitle" content="Curated Essay | Alfaaz Collective" />
  <meta name="twitter:description" id="twDesc" content="Read curated reflections and notes from the Alfaaz Collective archives." />
  <meta name="twitter:image" content="https://res.cloudinary.com/dmqwjpmjk/image/upload/c_fill,w_1200,h_630,q_auto,f_auto/v1777653360/photo_2026-05-01_22-00-43_jsuqqm.jpg" />
  <title>Curated Essay | Alfaaz Collective</title>
  <script src="https://unpkg.com/lucide@1.66.0/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="global.css">
  <script type="module" src="global.js"></script>
  <style>
    /* Pinned Reading Progress Bar */
    .reading-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: var(--accent-gold);
      z-index: 9999;
      transition: width 0.1s linear;
    }

    main {
      max-width: 820px;
      margin: 8rem auto 6rem;
      background: var(--bg-secondary);
      border: 1px solid var(--grid-border);
      box-shadow: var(--shadow-float);
      padding: 5rem 6rem;
      position: relative;
    }

    @media (max-width: 768px) {
      main { padding: 3rem 1.8rem; margin-top: 6rem; margin-bottom: 3rem; }
    }

    .post-header {
      border-bottom: 1px solid var(--grid-border);
      padding-bottom: 2.5rem;
      margin-bottom: 3.5rem;
      text-align: center;
    }
    
    .post-meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-gold-text);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .post-title {
      font-family: var(--font-heading);
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-bottom: 1.8rem;
    }

    .post-actions-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 1.2rem;
    }

    .share-pill-btn {
      background: transparent;
      border: 1px solid var(--grid-border);
      color: var(--text-secondary);
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.45rem 1rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s ease;
      border-radius: 0;
    }
    .share-pill-btn:hover {
      border-color: var(--accent-gold);
      color: var(--text-primary);
      background: rgba(189, 111, 93, 0.05);
    }

    /* Editorial Content Typography */
    .post-content {
      font-size: 1.15rem;
      line-height: 1.95;
      color: var(--text-primary);
      font-weight: 300;
    }
    
    /* Editorial Drop Cap on first letter */
    .post-content > p:first-of-type::first-letter {
      font-family: var(--font-heading);
      float: left;
      font-size: 3.8rem;
      line-height: 0.8;
      margin: 0.2rem 0.65rem 0 0;
      color: var(--accent-gold-text);
      font-weight: 500;
    }

    .post-content p { margin-bottom: 1.9rem; }
    
    .post-content h2 {
      font-family: var(--font-heading);
      font-size: 2.1rem;
      color: var(--text-primary);
      margin: 3.5rem 0 1.2rem;
      font-weight: 400;
      line-height: 1.3;
      border-bottom: 1px solid var(--grid-border);
      padding-bottom: 0.5rem;
    }

    .post-content h3 {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      color: var(--text-primary);
      margin: 2.5rem 0 1rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .post-content blockquote {
      border-left: 2px solid var(--accent-gold);
      padding-left: 1.8rem;
      margin: 2.5rem 0;
      font-style: italic;
      color: var(--text-secondary);
      font-size: 1.2rem;
      line-height: 1.8;
      background: rgba(189, 111, 93, 0.03);
      padding: 1.5rem 1.8rem;
    }

    .post-content ul, .post-content ol { margin: 1.5rem 0 2rem 2rem; }
    .post-content li { margin-bottom: 0.8rem; line-height: 1.8; color: var(--text-secondary); }

    .post-content a {
      color: var(--accent-gold-text);
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }
    .post-content a:hover { color: var(--text-primary); }

    .post-content pre {
      background: var(--bg-primary);
      border: 1px solid var(--grid-border);
      padding: 1.5rem;
      overflow-x: auto;
      font-size: 13px;
      margin: 2rem 0;
    }

    .post-content figure {
      margin: 2.5rem 0;
      text-align: center;
    }
    .post-content figure img {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--grid-border);
    }
    .post-content figcaption {
      font-size: 11px;
      color: var(--text-secondary);
      letter-spacing: 1px;
      margin-top: 0.8rem;
      font-style: italic;
    }

    /* Curator Closing Box */
    .curator-closing-box {
      margin-top: 4.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--grid-border);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
    }
    .curator-colophon {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    /* Skeleton Loading State */
    .skeleton-post-header { display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 3rem; }
    .skeleton-line { background: linear-gradient(90deg, rgba(45, 49, 46, 0.05) 25%, rgba(45, 49, 46, 0.12) 50%, rgba(45, 49, 46, 0.05) 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite ease-in-out; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    footer { text-align: center; padding: 3.5rem 0; border-top: 1px solid var(--grid-border); font-size: 10px; color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase; }
  </style>
</head>
<body>

  <!-- Pinned Reading Progress Bar -->
  <div id="readingProgress" class="reading-progress-bar"></div>

  <nav id="navbar" style="justify-content: space-between;">
    <a href="index.html" class="logo">ALFAAZ</a>
    <div class="nav-actions" style="display: flex; gap: 1.5rem; align-items: center;">
      <a href="blogs.html" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Curated Archives</a>
      <a href="index.html" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Return</a>
    </div>
  </nav>

  <main id="articleTarget">
    <div class="skeleton-post-header">
      <div class="skeleton-line" style="height: 14px; width: 220px;"></div>
      <div class="skeleton-line" style="height: 42px; width: 85%;"></div>
      <div class="skeleton-line" style="height: 28px; width: 120px;"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 1.2rem;">
      <div class="skeleton-line" style="height: 16px; width: 100%;"></div>
      <div class="skeleton-line" style="height: 16px; width: 95%;"></div>
      <div class="skeleton-line" style="height: 16px; width: 90%;"></div>
      <div class="skeleton-line" style="height: 16px; width: 98%;"></div>
      <div class="skeleton-line" style="height: 16px; width: 88%;"></div>
    </div>
  </main>

  <footer>
    <p>Alfaaz Collective // The Curator // Srinagar, Kashmir</p>
  </footer>

  <script type="module" src="src/post.js"></script>
</body>
</html>
