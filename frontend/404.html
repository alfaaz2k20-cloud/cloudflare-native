<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d312e">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>404 // Page Not Found — Alfaaz Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Alegreya+Sans:ital,wght@0,300..800;1,300..800&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/global.css">
  <script type="module" src="/global.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg-primary: #f4f1ea;
      --text-primary: #2d312e;
      --text-secondary: #6e726e;
      --accent-gold: #bd6f5d;
      --accent-gold-text: #964e3d;
      --grid-border: rgba(45, 49, 46, 0.14);
      --font-heading: 'Alegreya', 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Alegreya Sans', sans-serif;
      --font-urdu: 'Noto Nastaliq Urdu', serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
    }
    .error-frame {
      width: min(100%, 620px);
      border: 1px solid var(--grid-border);
      padding: clamp(2rem, 6vw, 3.5rem);
      text-align: center;
      background: rgba(255, 255, 255, 0.55);
      position: relative;
    }
    .error-frame::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 1px solid var(--grid-border);
      pointer-events: none;
    }
    .kicker {
      font-size: 0.72rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--accent-gold-text);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .folio-code {
      font-family: var(--font-heading);
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 400;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }
    .urdu-subtitle {
      font-family: var(--font-urdu);
      font-size: 1.25rem;
      color: var(--text-secondary);
      direction: rtl;
      margin-bottom: 1.5rem;
      line-height: 2;
    }
    p.description {
      font-size: 1.05rem;
      color: var(--text-secondary);
      max-width: 30rem;
      margin: 0 auto 2rem;
      line-height: 1.7;
    }
    .action-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin-top: 1.5rem;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 1.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      border-radius: 0;
    }
    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-primary);
      border: 1px solid var(--text-primary);
    }
    .btn-primary:hover {
      background: var(--accent-gold);
      border-color: var(--accent-gold);
      color: #ffffff;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--text-primary);
    }
    .btn-secondary:hover {
      background: rgba(45, 49, 46, 0.06);
    }
  </style>
</head>
<body>
  <main class="error-frame">
    <p class="kicker">Navigation Notice // 404</p>
    <div class="folio-code">404</div>
    <h1>Page Not Found</h1>
    <p class="urdu-subtitle">صفحہ دستیاب نہیں ہے</p>
    <p class="description">
      The page you are looking for does not exist or has been relocated. Return to the collective home to continue exploring.
    </p>
    <div class="action-group">
      <a class="btn btn-primary" href="/index.html">Return to Home</a>
      <a class="btn btn-secondary" href="/blogs.html">Browse Essays</a>
    </div>
  </main>
</body>
</html>
