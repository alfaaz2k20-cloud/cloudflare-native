<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module" src="global.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2d2722">
  <meta name="application-name" content="Alfaaz">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alfaaz">
  <link rel="apple-touch-icon" href="/images/icons/icon-192.png">
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
  <title>Reset Password — ALFAAZ</title>
  <script src="https://unpkg.com/lucide@1.66.0/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="global.css">
  
  
  <script type="module" src="src/reset.js"></script>
  <style>
    .auth-card { width: 100%; max-width: 420px; padding: 4rem 3rem; margin: 8rem auto; position: relative; }
    .auth-title { font-family: var(--font-heading); font-size: 1.75rem; text-align: center; margin-bottom: 0.85rem; font-weight: 400; line-height: 1.25; min-height: 2.2rem; }
    .auth-title.ur-hover { display: flex; align-items: center; justify-content: center; }
    .auth-title.ur-hover::before { font-size: 1.15em; top: 36%; line-height: 1.2; }
    .auth-subtitle { font-family: var(--font-body); font-size: 10px; color: var(--text-secondary); letter-spacing: 2px; text-align: center; margin-top: 0.25rem; margin-bottom: 2.75rem; text-transform: uppercase; line-height: 1.5; }
    .input-group { margin-bottom: 2rem; }
    .auth-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--grid-border); color: var(--text-primary); font-family: var(--font-body); font-size: 14px; padding: 0.5rem 0; transition: border-color 0.3s ease; }
    .auth-input:focus { outline: none; border-bottom-color: var(--accent-gold); }
    .password-wrap { position: relative; }
    .password-wrap .auth-input { padding-right: 3rem; }
    .toggle-pw { position: absolute; right: 0; bottom: 0.5rem; background: none; border: none; color: var(--text-secondary); font-family: var(--font-body); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 0; transition: color 0.3s ease; }
    .toggle-pw:hover { color: var(--accent-gold); }
    .strength-bar-wrap { margin-top: 8px; height: 2px; background: var(--grid-border); }
    .strength-bar { height: 100%; width: 0%; transition: width 0.4s ease, background 0.4s ease; }
    .strength-label, .match-indicator { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-top: 6px; min-height: 12px; }
    #expiredOverlay { display: none; position: absolute; inset: 0; background: var(--bg-primary); z-index: 10; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 2rem; }
    #expiredOverlay.show { display: flex; }
    
    @media (max-width: 600px) {
      .auth-card { width: 92%; padding: 2.5rem 1.5rem; margin: 5.5rem auto 2rem; }
      .auth-title { font-size: 1.5rem; }
      .auth-subtitle { margin-bottom: 2rem; }
    }
  </style>
</head>
<body>
  
  <nav id="navbar" style="justify-content: space-between;">
    <a href="index.html" class="logo ur-hover" data-ur="الفاظ">
      <span class="en-text">ALFAAZ</span>
    </a>
    <div class="nav-actions">
      <a href="login.html" class="ur-hover" data-ur="واپسی" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">
        <span class="en-text">Return to Login</span>
      </a>
    </div>
  </nav>

  <div class="auth-card panel">
    <div id="expiredOverlay" role="alert" aria-live="polite">
      <div style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--accent-red);">⊘</div>
      <p style="font-family:var(--font-heading); font-size: 1.8rem; color: var(--text-primary); margin-bottom: 0.5rem;">Link Expired</p>
      <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 2rem; line-height: 1.6;">This password reset link is invalid, expired, or has already been consumed.<br>Please request a new link.</p>
      <a href="login.html" class="action-btn">Return to Login</a>
    </div>

    <h1 class="auth-title ur-hover" data-ur="تجدید">
      <span class="en-text">Reset Password</span>
    </h1>
    <p class="auth-subtitle">Create a new secure password</p>

    <form id="resetForm" novalidate>
      <div class="input-group">
        <label class="input-label" for="newPassword">New Password</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" class="auth-input" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="toggle-pw" id="toggleNew" tabindex="-1" aria-label="Toggle new password visibility">show</button>
        </div>
        <div class="strength-bar-wrap"><div class="strength-bar" id="strengthBar"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
      </div>
      <div class="input-group">
        <label class="input-label" for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" class="auth-input" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Re-enter new password">
          <button type="button" class="toggle-pw" id="toggleConfirm" tabindex="-1" aria-label="Toggle confirm password visibility">show</button>
        </div>
        <div class="match-indicator" id="matchIndicator"></div>
      </div>
      <button type="submit" class="submit-btn" style="width:100%;">Update Password</button>
    </form>
  </div>

</body>
</html>
