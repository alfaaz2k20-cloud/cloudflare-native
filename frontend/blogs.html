<head>

  <meta property="og:site_name" content="Alfaaz Collective" />
  <meta property="og:title" content="Curated Archives | Alfaaz Collective" />
  <meta property="og:description" content="Essays, philosophical reflections, and artistic archives from the Srinagar Valley." />
  <meta property="og:image" content="https://res.cloudinary.com/dmqwjpmjk/image/upload/c_fill,w_1200,h_630,q_auto,f_auto/v1777653360/photo_2026-05-01_22-00-43_jsuqqm.jpg" />

  <title>Curated Archives | Alfaaz Collective</title>
  <script src="https://unpkg.com/lucide@1.66.0/dist/umd/lucide.min.js" defer></script>
  <link rel="stylesheet" href="global.css">
  <script type="module" src="global.js"></script>
  <style>
    main { max-width: 920px; margin: 7.5rem auto 5rem; padding: 0 1.5rem; min-height: 65vh; }
    
    .archive-header { margin-bottom: 2rem; border-bottom: 1px solid var(--grid-border); padding-bottom: 1.25rem; }
    .page-title { font-family: var(--font-heading); font-size: clamp(2.8rem, 5.5vw, 4.4rem); font-weight: 400; letter-spacing: 0.5px; color: var(--text-primary); margin-bottom: 0.5rem; line-height: 1.1; }
    .page-subtitle { font-family: var(--font-body); font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 2.5px; display: block; margin-bottom: 1.25rem; }
    
    .archive-controls { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 1rem; }
    .search-box-wrap { position: relative; flex: 1; min-width: 260px; max-width: 480px; }
    .search-box-wrap input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--grid-border);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 13px;
      padding: 0.75rem 1rem 0.75rem 2.4rem;
      border-radius: 0;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .search-box-wrap input:focus { border-color: var(--accent-gold); box-shadow: var(--shadow-base); }
    .search-icon-pos { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-secondary); pointer-events: none; }
    
    .archive-count { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-secondary); font-weight: 500; }

    .archive-grid { display: flex; flex-direction: column; gap: 1.75rem; }
    .archive-card {
      background: var(--bg-secondary);
      padding: 3rem 2.8rem;
      position: relative;
      transition: box-shadow 0.4s var(--transition-smooth), transform 0.4s var(--transition-smooth), border-color 0.4s var(--transition-smooth);
      border: 1px solid var(--grid-border);
      text-decoration: none;
      display: block;
      cursor: pointer;
      box-shadow: var(--shadow-base);
    }
    .archive-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-float);
      border-color: rgba(189, 111, 93, 0.45);
    }
    
    .archive-meta {
      display: flex;
      gap: 0.8rem;
      align-items: center;
      font-family: var(--font-body);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-gold-text);
      margin-bottom: 1rem;
    }
    .archive-title { font-family: var(--font-heading); font-size: 2.2rem; font-weight: 400; color: var(--text-primary); line-height: 1.25; margin-bottom: 1rem; transition: color 0.3s ease; }
    .archive-card:hover .archive-title { color: var(--accent-gold-text); }
    .archive-excerpt { font-family: var(--font-body); font-size: 13.5px; color: var(--text-secondary); line-height: 1.75; font-weight: 300; }
    
    .archive-footer-action { margin-top: 1.5rem; display: flex; align-items: center; gap: 0.4rem; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent-gold-text); font-weight: 600; }

    /* Skeleton Loading State */
    .skeleton-card { background: var(--bg-secondary); padding: 3rem 2.8rem; border: 1px solid var(--grid-border); display: flex; flex-direction: column; gap: 1rem; }
    .skeleton-line { background: linear-gradient(90deg, rgba(45, 49, 46, 0.05) 25%, rgba(45, 49, 46, 0.12) 50%, rgba(45, 49, 46, 0.05) 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite ease-in-out; border-radius: 0; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-badge { height: 12px; width: 180px; }
    .skeleton-title { height: 32px; width: 75%; margin-bottom: 0.5rem; }
    .skeleton-para-1 { height: 14px; width: 95%; }
    .skeleton-para-2 { height: 14px; width: 85%; }

    .empty-state { font-size: 12px; color: var(--text-secondary); text-align: center; padding: 4.5rem 2rem; text-transform: uppercase; letter-spacing: 2px; border: 1px dashed var(--grid-border); background: var(--bg-secondary); }
    
    footer { text-align: center; padding: 3.5rem 1rem; border-top: 1px solid var(--grid-border); font-size: 10px; color: var(--text-secondary); letter-spacing: 1.5px; text-transform: uppercase; }

    @media (max-width: 640px) {
      .archive-card { padding: 2rem 1.5rem; }
      .archive-title { font-size: 1.75rem; }
    }
  </style>
</head>
<body>

  <nav id="navbar" style="justify-content: space-between;">
    <a href="index.html" class="logo">ALFAAZ</a>
    <div class="nav-actions" style="display: flex; gap: 1.5rem; align-items: center;">
      <a href="dashboard.html" id="navDashboardLink" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Dashboard</a>
      <a href="index.html" style="font-size: 11px; color: var(--text-secondary); text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: color 0.3s ease;">Return</a>
    </div>
  </nav>

  <main>
    <header class="archive-header">
      <h1 class="page-title">Curated Archives</h1>
      <span class="page-subtitle">حکمت و احساس // Critical Essays, Reflections &amp; Historical Records</span>
      
      <div class="archive-controls">
        <div class="search-box-wrap">
          <i data-lucide="search" class="search-icon-pos"></i>
          <input type="text" id="archiveSearch" placeholder="Search essays, keywords, or topics..." aria-label="Search essays">
        </div>
        <span class="archive-count" id="archiveCount">Opening archives...</span>
      </div>
    </header>

    <div id="blogContainer" class="archive-grid">
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-badge"></div>
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-para-1"></div>
        <div class="skeleton-line skeleton-para-2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skeleton-line skeleton-badge"></div>
        <div class="skeleton-line skeleton-title"></div>
        <div class="skeleton-line skeleton-para-1"></div>
        <div class="skeleton-line skeleton-para-2"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>Alfaaz Collective // The Curator // Srinagar, Kashmir</p>
  </footer>

  <script type="module" src="src/blogs.js"></script>
</body>
</html>
